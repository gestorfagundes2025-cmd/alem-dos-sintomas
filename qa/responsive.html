<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Revisão responsiva</title>
<style>body{margin:0;background:#dce4e5;font:16px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#fff}label{display:flex;gap:8px}select,button{font:inherit;padding:8px}#stage{padding:20px;overflow:auto}iframe{display:block;background:white;border:0;transform-origin:top left;box-shadow:0 0 0 1px #788;}#viewport{margin:auto}</style>
<header><strong>Revisão da landing page</strong><label>Largura<select id="width"><option>320</option><option selected>390</option><option>768</option><option>1024</option><option>1440</option></select></label><label>Texto<select id="text"><option value="100">100%</option><option value="200">200%</option></select></label><button id="top">Topo</button><button id="countdown">Contador</button><button id="recognition">Sintomas</button><button id="learning">Conteúdo</button><button id="ebook">E-book</button><button id="founder">Doutora</button><button id="join">Ingresso</button><button id="faq">Dúvidas</button><output id="report"></output></header>
<div id="metrics" role="status" style="padding:8px 20px;font:14px system-ui">Carregando medições</div><pre id="overflow" style="white-space:pre-wrap;padding:0 20px;font-size:12px"></pre><div id="stage"><div id="viewport"><iframe id="page" src="/" title="Página em revisão" width="390" height="844"></iframe></div></div>
<script>
const page=document.getElementById('page'),viewport=document.getElementById('viewport'),width=document.getElementById('width'),text=document.getElementById('text');
function size(){const w=Number(width.value),scale=Math.min(1,(window.innerWidth-40)/w);page.width=w;page.height=w<768?844:1000;page.style.transform=`scale(${scale})`;viewport.style.width=w*scale+'px';viewport.style.height=Number(page.height)*scale+'px';if(page.contentDocument?.documentElement)page.contentDocument.documentElement.style.fontSize=text.value+'%';document.getElementById('report').textContent=w+'px · escala '+Math.round(scale*100)+'%';}
width.addEventListener('change',size);text.addEventListener('change',size);window.addEventListener('resize',size);page.addEventListener('load',size);
const targets={top:'inicio',countdown:'contagem',recognition:'encontro',learning:'conteudo-aula',ebook:'ebook',founder:'doutora',join:'participar',faq:'duvidas'};Object.entries(targets).forEach(([button,target])=>document.getElementById(button).addEventListener('click',()=>{page.contentDocument.getElementById(target)?.scrollIntoView({behavior:'instant',block:'start'})}));
setInterval(()=>{const doc=page.contentDocument;if(!doc?.documentElement)return;const el=doc.documentElement;const broken=[...doc.images].filter(i=>i.complete&&!i.naturalWidth);document.getElementById('metrics').textContent='Tela '+width.value+' · Texto '+text.value+'% · largura '+el.clientWidth+' / conteúdo '+el.scrollWidth+' · imagens com falha '+broken.length+' · marca '+(/Shalom|Chalom/i.test(doc.body.innerText)?'INCORRETA':'correta');const bad=[...doc.body.querySelectorAll('*')].filter(e=>{const r=e.getBoundingClientRect();return r.right>el.clientWidth+1 && getComputedStyle(e).position!=='absolute'}).map(e=>({tag:e.tagName,cls:e.className,w:Math.round(e.getBoundingClientRect().width),r:Math.round(e.getBoundingClientRect().right)}));document.getElementById('overflow').textContent=el.scrollWidth>el.clientWidth?JSON.stringify(bad.slice(0,15)):'';},250);
</script></html>
