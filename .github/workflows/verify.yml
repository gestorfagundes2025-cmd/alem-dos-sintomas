name: Verificar Saúde Shalon
on:
  push:
    branches: [feat/saude-shalon-lp]
permissions:
  contents: write
  deployments: read
concurrency:
  group: saude-shalon-preview
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm test
      - name: Preparar otimização de imagens
        run: python -m pip install 'Pillow>=10,<13'
      - name: Otimizar imagens para WebP
        run: python scripts/optimize_assets.py
      - run: npm run build
      - name: Preparar testes de navegador
        run: python -m pip install 'playwright>=1.55,<2'
      - name: Validar primeira dobra, responsividade e integração visual
        run: python scripts/browser_qa_v7.py
      - name: Versionar evidências da revisão final
        run: |
          git add qa/v7 public/assets/*.webp
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: registra QA final v7 e acervo [skip ci]'
            git push origin HEAD:feat/saude-shalon-lp
          fi
      - name: Conferir prévia pela integração GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect-preview.mjs
      - name: Empacotar projeto e evidências
        uses: actions/upload-artifact@v7
        with:
          name: Saude-Shalon-LP-v7
          retention-days: 14
          if-no-files-found: error
          path: |
            src/
            public/
            scripts/
            tests/
            docs/
            qa/v7/
            dist/
            package.json
            site.config.mjs
            assets.manifest.json
            vercel.json
            README.md
