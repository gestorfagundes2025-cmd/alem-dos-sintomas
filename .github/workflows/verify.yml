name: Verificar Saúde Shalon
on:
  push:
    branches: [feat/saude-shalon-lp]
permissions:
  contents: write
concurrency:
  group: saude-shalon-preview
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node scripts/import-reference.mjs
      - run: node scripts/media-metadata.mjs
      - run: npm test
      - run: npm run build
      - name: Preparar testes de navegador
        run: python -m pip install 'playwright>=1.55,<2'
      - name: Validar responsividade, imagens e interações
        run: python scripts/browser_qa.py
      - name: Empacotar código, mídia e prévias da revisão
        uses: actions/upload-artifact@v7
        with:
          name: Saude-Shalon-LP-v2
          retention-days: 7
          if-no-files-found: error
          path: |
            src/
            public/
            scripts/
            tests/
            docs/
            qa/v2/
            dist/
            package.json
            site.config.mjs
            assets.manifest.json
            vercel.json
            README.md
      - name: Versionar evidências e mídia pública
        run: |
          git add public/assets public/reference-media.json qa/v2
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test: registra revisão visual e validação responsiva da LP [skip ci]'
            git push origin HEAD:feat/saude-shalon-lp
          fi
