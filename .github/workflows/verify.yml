name: Verificar Saúde Shalon
on:
  push:
    branches: [feat/saude-shalon-lp]
permissions:
  contents: write
concurrency:
  group: saude-shalon-preview
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm test
      - run: npm run build
      - name: Versionar imagens públicas do acervo de marketing
        run: |
          git add public/assets/*.jpg
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: versiona imagens institucionais da LP [skip ci]'
            git push origin HEAD:feat/saude-shalon-lp
          fi
