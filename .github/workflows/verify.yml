name: Verificar Saúde Shalon
on:
  push:
    branches: [feat/saude-shalon-lp]
permissions:
  contents: write
  deployments: read
concurrency:
  group: saude-shalon-preview
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Aplicar refinamento editorial idempotente
        run: node scripts/refine-layout.mjs
      - run: npm test
      - run: npm run build
      - name: Preparar testes de navegador
        run: python -m pip install 'playwright>=1.55,<2'
      - name: Validar responsividade e interações
        run: python scripts/browser_qa_v3.py
      - name: Versionar fonte final e evidências
        run: |
          git add src/index.html qa/v3
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: consolida layout editorial e QA v3 [skip ci]'
            git push origin HEAD:feat/saude-shalon-lp
          fi
      - name: Conferir prévia pela integração GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect-preview.mjs
      - name: Empacotar projeto e evidências
        uses: actions/upload-artifact@v7
        with:
          name: Saude-Shalon-LP-v3
          retention-days: 14
          if-no-files-found: error
          path: |
            src/
            public/
            scripts/
            tests/
            docs/
            qa/v3/
            dist/
            package.json
            site.config.mjs
            assets.manifest.json
            vercel.json
            README.md
